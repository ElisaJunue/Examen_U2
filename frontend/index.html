<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <!--NAVBAR-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.htm]">Consulta Médica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarlav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="medicos.html">Médicos</a></li>
                    <li class="nav-item"><a class="nav-link" href="citas.html">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                     <li class="nav-item">
                        <button class="btn btn-outline-light ms-2" onclick="logout()">Cerrar sesión</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--CONTENIDO-->
    <div class="container text-center mt-5">
        <h1 class="display-4">Bienvenido al Sistema de Consulta Médica Online</h1>
        <p class="lead">Aquí puedes agendar tus citas, consultar con médicos certificados y llevar un control de tu
            salud.</p>
    </div>
    <!--FOOTER-->
    <footer class="text-center mt-5 mb-3 text-muted">
        <hr />
        <p>© 2025 Consulta Médica Online</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const log = sessionStorage.getItem('log') === 'true';
        const nombre = sessionStorage.getItem('nombrePaciente') || '';
        const idPaciente = sessionStorage.getItem('idPaciente');
        if (!log) {
            console.log("Redirigiendo a login.html desde index.html");
            window.location.href = 'login.html';
        }
        else{
            console.log(`Paciente ${nombre} (ID: ${idPaciente}) ha iniciado sesión`);
        }
        function logout() {
            sessionStorage.clear(); // o puedes hacer removeItem por item si prefieres
            console.log("Sesión cerrada");
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
