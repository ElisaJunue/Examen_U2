<!DOCTYPE html>
<html lang="es" ng-app="citasApp">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="CitasController">

    <!--NAVBAR-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Consulta Médica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="medicos.html">Médicos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="citas.html">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- FORMULARIO PARA NUEVA CITA -->
    <div class="container mt-4">
        <h4>Agendar nueva cita</h4>
        <form ng-submit="agendarCita()" class="row g-3 mb-4">

            <div class="col-md-4">
                <label for="doctorSelect" class="form-label">Seleccione un médico:</label>
                <select id="doctorSelect" class="form-select" ng-model="nuevaCita.idMedico"
                    ng-options="medico.id as medico.nombre + ' (' + medico.especialidad + ')' for medico in medicos"
                    required>
                    <option value="">-- Seleccione un médico --</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="fechaCita" class="form-label">Fecha de la cita:</label>
                <input type="date" id="fechaCita" class="form-control" ng-model="nuevaCita.fecha" required />
            </div>

            <div class="col-12">
                <button class="btn btn-success" type="submit">Agendar</button>
            </div>

        </form>

        <!-- LISTA DE CITAS -->
        <h4>Mis Citas</h4>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>Médico</th>
                    <th>Especialidad</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="cita in citas">
                    <td>{{ cita.medico }}</td>
                    <td>{{ cita.especialidad }}</td>
                    <td>{{ cita.fecha }}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" ng-click="cancelarCita(cita.id)">Cancelar</button>
                    </td>
                </tr>
                <tr ng-if="citas.length === 0">
                    <td colspan="4" class="text-center">No tienes citas agendadas.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!--FOOTER -->
    <footer class="text-center mt-5 mb-3 text-muted">
        <hr />
        <p>© 2025 Consulta Médica Online</p>
    </footer>

    <!--JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        angular.module('citasApp', [])
            .controller('CitasController', function ($scope, $http) {
                $scope.citas = [];
                $scope.medicos = [];
                $scope.nuevaCita = { idMedico: null, fecha: "" };

                // Obtener idPaciente del sessionStorage
                const idPaciente = sessionStorage.getItem('idPaciente');
                if (!idPaciente) {
                    alert("No hay sesión activa, redirigiendo a login");
                    window.location.href = 'login.html';
                    return;
                }

                // Cargar lista de doctores
                $http.get("http://localhost:8080/doctors")
                    .then(function (response) {
                        $scope.medicos = response.data;
                    })
                    .catch(function () {
                        alert("Error al cargar los doctores");
                    });

                // Cargar solo citas del paciente actual desde el backend
                $scope.cargarCitas = function () {
                    $http.get("http://localhost:8080/appointments/paciente/" + idPaciente)
                        .then(function (response) {
                            const hoy = new Date().toISOString().slice(0, 10);
                            // Filtrar solo citas con fecha >= hoy
                            $scope.citas = response.data.filter(cita => cita.fecha >= hoy);
                        })
                        .catch(function () {
                            alert("Error al cargar las citas");
                        });
                };


                // Cargar citas inicialmente
                $scope.cargarCitas();

                // Agendar cita
                $scope.agendarCita = function () {
                    if (!$scope.nuevaCita.idMedico || !$scope.nuevaCita.fecha) {
                        alert("Seleccione doctor y fecha");
                        return;
                    }

                    const payload = {
                        idMedico: String($scope.nuevaCita.idMedico),
                        idPaciente: String(idPaciente),
                        fecha: new Date($scope.nuevaCita.fecha).toISOString().slice(0, 10)
                    };

                    console.log("Payload que se enviará al backend:", payload);

                    $http.post("http://localhost:8080/appointments", payload)
                        .then(function (response) {
                            alert("Cita agendada con éxito");

                            // Recargar las citas para reflejar la nueva
                            $scope.cargarCitas();

                            // Reset form
                            $scope.nuevaCita = { idMedico: null, fecha: "" };
                        })
                        .catch(function (error) {
                            console.error("Error al agendar la cita:", error);
                            alert("Error al agendar la cita");
                        });
                };

                // Cancelar cita
                $scope.cancelarCita = function (id) {
                    if (!id) {
                        alert("No se puede cancelar una cita sin ID.");
                        return;
                    }

                    if (confirm("¿Estás seguro de cancelar esta cita?")) {
                        $http.delete('http://localhost:8080/appointments/' + id)
                            .then(function () {
                                alert("Cita cancelada correctamente");
                                // Recargar la lista después de borrar
                                $scope.cargarCitas();
                            })
                            .catch(function () {
                                alert("No se pudo cancelar la cita");
                            });
                    }
                };

            });
    </script>
</body>

</html>
